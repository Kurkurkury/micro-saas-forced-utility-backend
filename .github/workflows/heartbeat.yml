name: Heartbeat Ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /jobs/ack
        run: |
          curl -sS -X POST "${{ secrets.JOB_URL }}/jobs/ack" \
            -H "x-api-key: ${{ secrets.JOB_API_KEY }}" \
            -o /dev/null -w "status=%{http_code}\n"
